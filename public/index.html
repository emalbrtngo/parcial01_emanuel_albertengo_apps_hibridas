<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Harry Potter - Home</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <div class="container">
        <header class="mb-4">

            <nav class="navbar navbar-expand-lg bg-body-secondary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="/">HPWorld</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>


                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="/">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/personajes">Personajes</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/personajes/nuevo">Nuevo Personaje</a>
                            </li>
                        </ul>

                        <form class="d-flex mb-3" action="/personajes" method="GET">
                            <input class="form-control me-2" type="text" name="title"
                                placeholder="Buscar por nombre..." />
                            <button class="btn btn-outline-success" type="submit">Buscar</button>
                        </form>
                    </div>
                </div>
            </nav>

        </header>
        <main class="bg-light text-center py-5">
            <h1>Bienvenido a HPWorld</h1>
            <p>Explora el mundo de Harry Potter y conoce a todos tus personajes favoritos.</p>
            <p>Además podes crear nuevos personajes y gestionar tu colección.</p>
        </main>
    </div>
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container my-3 text-center">
            <span class="text-muted">Nombre: Emanuel Apellido: Albertengo - Materia: Aplicaciones Híbridas</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
